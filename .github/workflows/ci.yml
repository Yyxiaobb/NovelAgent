name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
      SQL_ECHO: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run Python lint checks
        run: python -m ruff check .

      - name: Audit Python dependencies
        run: python -m pip install pip-audit && python -m pip_audit -r requirements-dev.txt

      - name: Run backend tests with coverage
        run: |
          python -m coverage erase
          python -m coverage run --branch --source=agent,config,crud,models,routers,schemas,services,utils -m unittest discover -s tests -p "test_*.py" -v
          python -m coverage report --show-missing --fail-under=50

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Verify migration head
        run: python -m alembic heads | grep -q "^0002_consistent_project_stats "

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --registry=https://registry.npmjs.org --audit-level=high

      - name: Run frontend tests
        run: npm test

      - name: Run frontend lint checks
        run: npm run lint -- --max-warnings=0

      - name: Check frontend formatting
        run: npm run format:check

      - name: Build frontend
        run: npm run build
